# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    # ubuntu-latest is moving to 26.04, where setup-r's apt step alone took
    # 20 minutes. Stay on 24.04 until that settles.
    runs-on: ubuntu-24.04
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # CRAN packages already come from Posit Package Manager as binaries, but
      # pak fetches Bioconductor packages (phyloseq, Biostrings, ...) from
      # bioconductor.posit.co, which only has sources, so they all compile.
      # Package Manager's Bioconductor mirror serves prebuilt Linux binaries.
      - name: Use prebuilt Bioconductor binaries
        run: echo "R_BIOC_MIRROR=https://packagemanager.posit.co/bioconductor/__linux__/$(lsb_release -cs)/latest" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
