# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

name: R CMD check

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - R/**
      - src/**
      - tests/**
      - .Rbuildignore
      - .github/workflows/R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    
    timeout-minutes: 60
    
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,     r: 'release'}
          - {os: windows-latest,   r: 'release'}
          - {os: ubuntu-latest,    r: 'release'}

          - {os: macos-latest,     r: 'devel'}
          - {os: macos-latest,     r: 'oldrel-1'}
          - {os: macos-latest,     r: '4.3', extra: 'tidytree@0.4.6'}
          - {os: macos-15,         r: 'release'}
          - {os: windows-latest,   r: 'devel'}
          - {os: windows-latest,   r: 'oldrel-1'}
          - {os: windows-latest,   r: '4.3', extra: 'tidytree@0.4.6'}
          - {os: windows-2022,     r: 'release'}
          - {os: ubuntu-latest,    r: 'devel' }
          - {os: ubuntu-latest,    r: 'oldrel-1'}
          - {os: ubuntu-22.04,     r: '4.3', extra: 'tidytree@0.4.6'}
          - {os: ubuntu-22.04,     r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no
      NOT_CRAN: true
      PAK_DEBUG: true
      # pak's default Bioconductor mirror (bioconductor.posit.co) no longer
      # serves Bioconductor 3.18, the release for R 4.3.
      R_BIOC_MIRROR: https://bioconductor.org

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # R >= 4.7 on macOS links Fortran/LAPACK packages (e.g. irlba) against the
      # flang runtime in /opt/R/flang-23, and CRAN has no binaries for it yet,
      # so packages build from source and need CRAN's static system libraries
      # in /opt/R/<arch>: jpeglib.h for jpeg, png.h for png, and libintl.h
      # (gettext) for data.table, which phyloseq imports.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          libdir="/opt/R/$(uname -m)"
          echo "FLIBS: $(R CMD config FLIBS)"
          ls -d /opt/R/* 2>/dev/null || echo "/opt/R is empty"

          install_tarball() {
            echo "Installing $1"
            curl -fsSL "$1" | sudo tar -xJf - -C /
          }

          if R CMD config FLIBS | grep -q '/opt/R/flang-23'; then
            # flang needs SDKROOT set, even when the image already provides it.
            echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
            [ -d /opt/R/flang-23 ] ||
              install_tarball https://mac.r-project.org/tools/flang-23.1.0-darwin23.tar.xz
          fi

          headers="jpeglib.h png.h libintl.h"
          for h in $headers; do
            if [ ! -f "$libdir/include/$h" ]; then
              urls=$(SILENT_INSTALL_R=1 Rscript -e 'source("https://mac.r-project.org/bin/install.R"); cat(install.libs(c("jpeg", "libpng", "gettext"), action = "list", quiet = TRUE), sep = "\n")')
              for url in $urls; do install_tarball "$url"; done
              break
            fi
          done

          # Fail here rather than midway through building dependencies.
          for h in $headers; do ls -l "$libdir/include/$h"; done

      # R 4.3 gets Bioconductor 3.18, whose treeio (needed by
      # TreeSummarizedExperiment) calls tidytree:::random_ref at install
      # time; tidytree 0.4.7 removed it. Source builds of treeio fail
      # without the pin.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.extra }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

      - name: Show install log
        if: always()
        run: find . -name '00install.out' -exec cat {} +
        shell: bash
