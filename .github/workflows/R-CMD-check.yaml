# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

name: R CMD check

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - R/**
      - src/**
      - tests/**
      - .Rbuildignore
      - .github/workflows/R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    
    timeout-minutes: 60
    
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,     r: 'release'}
          - {os: windows-latest,   r: 'release'}
          - {os: ubuntu-latest,    r: 'release'}

          - {os: macos-latest,     r: 'devel'}
          - {os: macos-latest,     r: 'oldrel-1'}
          - {os: macos-latest,     r: '4.3'}
          - {os: macos-14,         r: 'release'}
          - {os: windows-latest,   r: 'devel'}
          - {os: windows-latest,   r: 'oldrel-1'}
          - {os: windows-latest,   r: '4.3'}
          - {os: windows-2022,     r: 'release'}
          - {os: ubuntu-latest,    r: 'devel' }
          - {os: ubuntu-latest,    r: 'oldrel-1'}
          - {os: ubuntu-22.04,     r: '4.3'}
          - {os: ubuntu-22.04,     r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no
      NOT_CRAN: true
      PAK_DEBUG: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # R >= 4.7 on macOS links Fortran/LAPACK packages (e.g. irlba) against
      # the flang runtime in /opt/R/flang-23, which the runner image lacks.
      # CRAN has no binaries for it yet either, so packages build from source
      # and need CRAN's static system libraries in /opt/R/arm64 (e.g. jpeg).
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if R CMD config FLIBS | grep -q '/opt/R/flang-23' && [ ! -d /opt/R/flang-23 ]; then
            curl -fsSL https://mac.r-project.org/tools/flang-23.1.0-darwin23.tar.xz | sudo tar -xJf - -C /
            echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

            urls=$(SILENT_INSTALL_R=1 Rscript -e 'source("https://mac.r-project.org/bin/install.R"); cat(install.libs(c("jpeg", "libpng"), action = "list", quiet = TRUE), sep = "\n")')
            for url in $urls; do
              echo "Installing $url"
              curl -fsSL "$url" | sudo tar -xJf - -C /
            done
          fi

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--as-cran")'

      - name: Show install log
        if: always()
        run: find . -name '00install.out' -exec cat {} +
        shell: bash
